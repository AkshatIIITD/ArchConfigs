# https://sw.kovidgoyal.net/kitty/conf/

# Fonts
font_family      JetBrainsMono Nerd Font
font_size        11.0

# Window Layout
window_padding_width 8
hide_window_decorations yes
# Ask before closing only if something other than the shell is running (e.g. nvim)
confirm_os_window_close -1

# Scrollback
scrollback_lines 10000

# Visuals (blur comes from Hyprland's decoration:blur)
background_opacity 0.95
enable_audio_bell no

# Colors: theme accents only (bg #0f0f0f, fg #ffffff, accent #00ffff);
# the 16 ANSI colours stay at kitty's defaults
background           #0f0f0f
foreground           #ffffff
cursor               #00ffff
cursor_text_color    #0f0f0f
selection_background #00ffff
selection_foreground #0f0f0f
url_color            #00ffff
