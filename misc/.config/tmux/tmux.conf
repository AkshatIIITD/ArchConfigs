# =============================================
# 1. CORE & DISPLAY SETTINGS
# =============================================

set -g default-terminal "tmux-256color"
# True colour for kitty (TERM=xterm-kitty)
set -as terminal-features ',xterm-kitty:RGB'

# Clickable OSC 8 hyperlinks
set -as terminal-features ',*:hyperlinks'

set -g mouse on
set -g focus-events on     # lets nvim notice files changed outside the editor
set -g history-limit 10000 # same scrollback as kitty

# Reload this file (prefix + r)
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"


# =============================================
# 2. KEYBINDINGS: NAVIGATION
# =============================================

# Alt + vim keys to switch panes (no prefix needed)
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Alt + Shift + h/l to switch windows (no prefix needed)
bind -n M-H previous-window
bind -n M-L next-window

# Cycle sessions with prefix + ) and ( (repeatable: prefix ) ) ) ...)
bind -r ) switch-client -n
bind -r ( switch-client -p


# =============================================
# 3. SESSIONS, WINDOWS & PANES
# =============================================

# Rename session (prefix + Ctrl+s) and window (prefix + Ctrl+w)
bind C-s command-prompt -I "#S" "rename-session '%%'"
bind C-w command-prompt -I "#W" "rename-window '%%'"

# Kill window with X, after confirming (replaces &)
unbind &
bind X confirm-before -p "kill-window #W? (y/n)" kill-window

# New session (prefix + N); attaches if the name already exists
bind N command-prompt -p "New Session Name:" "new-session -A -s '%%'"

# New splits and windows open in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"


# =============================================
# 4. COPY MODE (VI STYLE)
# =============================================

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"


# =============================================
# 5. THEME: STATUS BAR (desktop palette)
# =============================================
# bg #0f0f0f, fg #ffffff, accent #00ffff, muted #888888
# (same as kitty, waybar and mako); arrows need a Nerd Font

set -g status-position top
set -g status-justify left
set -g status-style 'bg=#0f0f0f fg=#ffffff'

# Left: session name in a cyan block, arrow into the bar
set -g status-left '#[bg=#00ffff,fg=#0f0f0f,bold] #S #[fg=#00ffff,bg=#0f0f0f,nobold] '
set -g status-left-length 30

# Window tabs: inactive muted grey, active in a cyan block
setw -g window-status-format '#[fg=#888888,bg=#0f0f0f] #I:#W '
setw -g window-status-current-format '#[fg=#0f0f0f,bg=#00ffff,nobold]#[fg=#0f0f0f,bg=#00ffff,bold] #I:#W #[fg=#00ffff,bg=#0f0f0f,nobold]'

# Right: date and time in a cyan block
set -g status-right '#[fg=#00ffff,bg=#0f0f0f,nobold]#[fg=#0f0f0f,bg=#00ffff,bold] %Y-%m-%d  %H:%M '
set -g status-right-length 50


# =============================================
# 6. THEME: BORDERS, MESSAGES & SELECTION
# =============================================

set -g pane-border-style 'fg=#333333'
set -g pane-active-border-style 'fg=#00ffff'

set -g message-style 'bg=#00ffff fg=#0f0f0f'
set -g message-command-style 'bg=#0f0f0f fg=#ffffff'

# Copy mode / choose-tree selection (matches kitty's selection colours)
set -g mode-style 'bg=#00ffff fg=#0f0f0f'
