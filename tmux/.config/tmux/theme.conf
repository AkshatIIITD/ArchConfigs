# tmux/theme.conf: status bar, borders and selection colours.
# Sourced by tmux.conf after the palette, so $THEME_* is already set here
# (tmux expands variables while parsing a file, before running its commands).
# Double quotes so $THEME_* expands; arrows need a Nerd Font.

set -g status-position top
set -g status-justify left
set -g status-style "bg=$THEME_BG fg=$THEME_FG"

# Left: session name in an accent block, arrow into the bar
set -g status-left "#[bg=$THEME_ACCENT,fg=$THEME_BG,bold] #S #[fg=$THEME_ACCENT,bg=$THEME_BG,nobold] "
set -g status-left-length 30

# Window tabs: inactive muted, active in an accent block
setw -g window-status-format "#[fg=$THEME_MUTED,bg=$THEME_BG] #I:#W "
setw -g window-status-current-format "#[fg=$THEME_BG,bg=$THEME_ACCENT,nobold]#[fg=$THEME_BG,bg=$THEME_ACCENT,bold] #I:#W #[fg=$THEME_ACCENT,bg=$THEME_BG,nobold]"

# Right: date and time in an accent block
set -g status-right "#[fg=$THEME_ACCENT,bg=$THEME_BG,nobold]#[fg=$THEME_BG,bg=$THEME_ACCENT,bold] %Y-%m-%d  %H:%M "
set -g status-right-length 50


# =============================================
# 6. THEME: BORDERS, MESSAGES & SELECTION
# =============================================

set -g pane-border-style "fg=$THEME_SURFACE"
set -g pane-active-border-style "fg=$THEME_ACCENT"

set -g message-style "bg=$THEME_ACCENT fg=$THEME_BG"
set -g message-command-style "bg=$THEME_BG fg=$THEME_FG"

# Copy mode / choose-tree selection (matches kitty's selection colours)
set -g mode-style "bg=$THEME_ACCENT fg=$THEME_BG"
