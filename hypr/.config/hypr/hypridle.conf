# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    # Start hyprlock only if it isn't already running (avoids stacking lock screens)
    lock_cmd = pidof hyprlock || hyprlock

    # Lock the screen BEFORE systemd puts the system to sleep
    before_sleep_cmd = loginctl lock-session

    # Turn the screen back on after resume without needing a key press
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 1. VISUAL WARNING: Dim the screen after 4 minutes of inactivity (requires brightnessctl)
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 2. SCREEN LOCK: Lock the session after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. POWER SAVING: Turn off the screens after 6 minutes
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 4. DEEP SLEEP: Suspend the system via systemd after 15 minutes of inactivity
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
