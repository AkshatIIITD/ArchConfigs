# https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
# Images live in ~/Pictures/Wallpapers (not versioned in this repo).
# This only sets the first wallpaper; rotation (every 30 min) and SUPER+W
# are handled by scripts/wallpaper.sh. hyprpaper's own `timeout` is not
# used, because any wallpaper set over IPC (SUPER+W) stops it.

splash = false

wallpaper {
    monitor =                       # all monitors
    path = ~/Pictures/Wallpapers
    fit_mode = cover
}
