# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
background {
    monitor =
    # Current wallpaper, blurred. scripts/wallpaper.sh keeps this link updated.
    path = ~/.cache/current-wallpaper
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.15
    dots_fade_time = 200
    
    # Theme accent cyan (#00ffff), same as waybar/swayosd/mako
    outer_color = rgba(0, 255, 255, 0.6)
    inner_color = rgba(15, 15, 15, 0.6)
    font_color = rgb(200, 200, 200)
    
    fade_on_empty = false
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}
