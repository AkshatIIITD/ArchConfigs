# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    # This prevents the system from locking while you are watching a full-screen video
    lock_cmd = pidof hyprlock || hyprlock
    
    # Secure Hook: Lock the screen BEFORE systemd puts the system to sleep
    before_sleep_cmd = loginctl lock-session
}

# 1. VISUAL WARNING: Dim the screen slightly after 4 minutes of inactivity
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 2. SCREEN LOCK: Lock the workspace after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. POWER SAVING: Turn off the screen backlights after 6 minutes
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 4. DEEP SLEEP: Suspend the system via systemd after 15 minutes of absolute inactivity
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
