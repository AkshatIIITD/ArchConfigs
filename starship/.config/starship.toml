"$schema" = 'https://starship.rs/config-schema.json'

# Desktop palette below; ~/.config/theme/apply makes a copy with another one.
# [cyan: os + user] -> [dark: folder, git, language] -> [cyan: clock] -> prompt char
format = """
[](accent)\
$os\
$username\
[](fg:accent bg:surface)\
$directory\
$git_branch\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:surface bg:accent)\
$time\
[ ](fg:accent)\
$cmd_duration\
$line_break\
$character"""

palette = 'desktop'

[palettes.desktop]
accent = "#00ffff"
base = "#0f0f0f"
text = "#ffffff"
muted = "#888888"
surface = "#333333"
warn = "#ffaa00"
crit = "#ff3333"

[os]
disabled = false
style = "bg:accent fg:base"

[os.symbols]
Arch = '󰣇'
Linux = '󰌽'

[username]
show_always = true
style_user = "bg:accent fg:base"
# root stands out in red
style_root = "bg:crit fg:text"
format = '[ $user ]($style)'

[directory]
style = "bg:surface fg:text bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = '󰈙 '
"Downloads" = ' '
"Music" = '󰝚 '
"Pictures" = ' '
"Developer" = '󰲋 '

# Git and languages draw their own thin separator, so they vanish cleanly when absent
[git_branch]
symbol = ''
style = "bg:surface fg:accent"
format = '[](fg:muted bg:surface)[ $symbol $branch ]($style)'

[git_status]
style = "bg:surface fg:warn"
format = '[($all_status$ahead_behind )]($style)'

[c]
symbol = ' '
style = "bg:surface fg:muted"
format = '[](fg:muted bg:surface)[ $symbol( $version) ]($style)'

[rust]
symbol = ''
style = "bg:surface fg:muted"
format = '[](fg:muted bg:surface)[ $symbol( $version) ]($style)'

[golang]
symbol = ''
style = "bg:surface fg:muted"
format = '[](fg:muted bg:surface)[ $symbol( $version) ]($style)'

[nodejs]
symbol = ''
style = "bg:surface fg:muted"
format = '[](fg:muted bg:surface)[ $symbol( $version) ]($style)'

[bun]
symbol = ''
style = "bg:surface fg:muted"
format = '[](fg:muted bg:surface)[ $symbol( $version) ]($style)'

[php]
symbol = ''
style = "bg:surface fg:muted"
format = '[](fg:muted bg:surface)[ $symbol( $version) ]($style)'

[java]
symbol = ' '
style = "bg:surface fg:muted"
format = '[](fg:muted bg:surface)[ $symbol( $version) ]($style)'

[kotlin]
symbol = ''
style = "bg:surface fg:muted"
format = '[](fg:muted bg:surface)[ $symbol( $version) ]($style)'

[haskell]
symbol = ''
style = "bg:surface fg:muted"
format = '[](fg:muted bg:surface)[ $symbol( $version) ]($style)'

[python]
symbol = ''
style = "bg:surface fg:muted"
format = '[](fg:muted bg:surface)[ $symbol( $version)(\(#$virtualenv\)) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:accent fg:base"
format = '[  $time ]($style)'

[cmd_duration]
# Shown for commands over 2 s; desktop notification (mako) over 45 s
min_time = 2000
show_milliseconds = false
style = "fg:muted"
format = '[took $duration ]($style)'
show_notifications = true
min_time_to_notify = 45000

[line_break]
disabled = true

[character]
success_symbol = '[❯](bold fg:accent)'
error_symbol = '[❯](bold fg:crit)'
vimcmd_symbol = '[❮](bold fg:accent)'
vimcmd_replace_one_symbol = '[❮](bold fg:warn)'
vimcmd_replace_symbol = '[❮](bold fg:warn)'
vimcmd_visual_symbol = '[❮](bold fg:muted)'
